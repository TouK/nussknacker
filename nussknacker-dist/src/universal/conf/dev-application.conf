flinkMiniClusterStorage: /tmp/flinkMiniClusterStorage
flinkMiniClusterStorage: ${?WORKING_DIR}

flinkMiniClusterConfig {
  "state.backend.type": "hashmap"
  "execution.checkpointing.savepoint-dir": "file://"${flinkMiniClusterStorage}"/savepoints"
  "metrics.reporters": "influxdb_reporter,prometheus_reporter"
  "metrics.reporter.prometheus_reporter.factory.class": "org.apache.flink.metrics.prometheus.PrometheusReporterFactory"
  "metrics.reporter.influxdb_reporter.factory.class": "org.apache.flink.metrics.influxdb.InfluxdbReporterFactory"
  "metrics.reporter.influxdb_reporter.host": "localhost"
  "metrics.reporter.influxdb_reporter.port": 3087
  "metrics.reporter.influxdb_reporter.db": "nussknacker_metrics"
  // If we don't provide username and password, error is thrown, because flink-influxdb-reporter adds BasicAuthInterceptor see InfluxDBImpl
  "metrics.reporter.influxdb_reporter.username": "dummy"
  "metrics.reporter.influxdb_reporter.password": "dummy"
  "metrics.reporter.influxdb_reporter.scope.variables.excludes": "tm_id;job_id;task_id;task_attempt_id;operator_id;task_attempt_num;task_name"
  "metrics.scope.jm": "local.<host>.jobmanagerGlobal"
  "metrics.scope.jm-job": "local.<host>.jobmanagerJob.<job_name>"
  "metrics.scope.tm": "local.<host>.taskmanagerGlobal.<tm_id>"
  "metrics.scope.tm-job": "local.<host>.taskmanagerJob.<tm_id>.<job_name>"
  "metrics.scope.task": "local.<host>.taskmanagerTask.<tm_id>.<job_name>.<task_name>.<subtask_index>"
  "metrics.scope.operator": "local.<host>.taskmanagerTask.<tm_id>.<job_name>.<operator_name>.<subtask_index>"
}

flinkDeploymentConfig {
  type: "flinkStreaming"
  restUrl: "http://jobmanager:8081"
  restUrl: ${?FLINK_REST_URL}
  useMiniClusterForDeployment: false
  useMiniClusterForDeployment: ${?FLINK_USE_MINICLUSTER_FOR_DEPLOY}
  miniCluster {
    config: {
      "metrics.reporter.prometheus_reporter.port": "9249"
    } ${flinkMiniClusterConfig}
  }
  scenarioStateVerification {
    enabled: ${?FLINK_SHOULD_VERIFY_BEFORE_DEPLOY}
  }
}

sqlEnricherDbPool {
  driverClassName: "org.postgresql.Driver"
  url: "jdbc:postgresql://"${SQL_ENRICHER_URL}"/world-db?currentSchema=public"
  username: "world"
  password: "world123"
}

metricsConfig {
  environment: ${environment},
  influx {
    url: "http://influxdb:8086/write",
    url: ${?INFLUXDB_URL}"/write",
    username: ${?INFLUXDB_USER},
    password: ${?INFLUXDB_PASSWORD},
    database: "nussknacker_metrics",
    database: ${?INFLUXDB_DATABASE},
  }
}

fragmentPropertiesDocsUrl: "https://nussknacker.io/documentation/docs/scenarios_authoring/Fragments/"

scenarioTypes {
  "streaming": {
    deploymentConfig: ${flinkDeploymentConfig}
    modelConfig: {
      classPath: ["model/defaultModel.jar", "model/flinkExecutor.jar", "components/flink", "components/common", "flink-dropwizard-metrics-deps/", "flink-metrics-plugins/"]
      rocksDB: {
        enable: ${?FLINK_ROCKSDB_ENABLE}
      }

      scenarioPropertiesDocsUrl: "https://example.com"

      components.openAPI {
        url: ${OPENAPI_SERVICE_URL}"/swagger"
        rootUrl: ${OPENAPI_SERVICE_URL}
      }

      components.databaseEnricher {
        config: {
          databaseQueryEnricher {
            name: "db-query"
            dbPool: ${sqlEnricherDbPool}
          }
          databaseLookupEnricher {
            name: "db-lookup"
            dbPool: ${sqlEnricherDbPool}
          }
        }
      }

      components.kafka {
        config: {
          kafkaProperties {
            "bootstrap.servers": ${KAFKA_ADDRESS}
            "schema.registry.url": ${SCHEMA_REGISTRY_URL}
          }
          kafkaEspProperties {
            defaultOffsetResetStrategy: "ToLatest"
          }
          useDataSampleParamForSchemalessJsonTopicBasedKafkaSource: true
        }
      }
      allowEndingScenarioWithoutSink: true
      liveDataPreview {
        enabled: true
        storage {
          type: "DESIGNER_DB"
          uploadIntervalInSeconds: 1
          url: "jdbc:hsqldb:file:"${storageDir}"/db;sql.syntax_ora=true"
          url: ${?DB_URL}
          driver: "org.hsqldb.jdbc.JDBCDriver"
          driver: ${?DB_DRIVER}
          user: "SA"
          user: ${?DB_USER}
          password: ""
          password: ${?DB_PASSWORD}
          schema: "public"
        }
      }
    }
    category: "Default"
  }
  "streaming-dev": {
    deploymentConfig: ${flinkDeploymentConfig}
    modelConfig: {
      classPath: ["model/devModel.jar", "model/flinkExecutor.jar", "components/flink", "flink-dropwizard-metrics-deps/"]
      rocksDB: {
        enable: true
        enable: ${?FLINK_ROCKSDB_ENABLE}
      }
      componentsUiConfig {
        sendCommunication {
          params {
            Text {
              defaultValue: "'Default value for text'"
            }
          }
          docsUrl: "https://nussknacker.io"
        }
      }
    }
    category: "Category1"
  }
  "streaming-dev2": {
    deploymentConfig: ${flinkDeploymentConfig}
    modelConfig: {
      classPath: ["model/devModel.jar", "model/flinkExecutor.jar", "components/flink", "flink-dropwizard-metrics-deps/"]
      rocksDB: {
        enable: true
        enable: ${?FLINK_ROCKSDB_ENABLE}
      }
      componentsUiConfig {
        sendCommunication {
          params {
            Text {
              defaultValue: "'Default value for text'"
            }
          }
          docsUrl: "https://nussknacker.io"
        }
      }
    }
    category: "Category2"
  }
  "batch-dev": {
    deploymentConfig: ${flinkDeploymentConfig}
    modelConfig: {
      classPath: ["model/defaultModel.jar", "components/flink/flinkBase.jar", "components/flink-table/flinkTable.jar", "model/flinkExecutor.jar", "flink-dropwizard-metrics-deps/"]
      rocksDB: {
        enable: true
        enable: ${?FLINK_ROCKSDB_ENABLE}
      }
      executionMode: "batch"
      components {
        flinkTableIO {
          testDataGenerationMode: "random"
          tableDefinition: """
          CREATE TABLE transactions
          (
              `datetime` TIMESTAMP,
              client_id  STRING,
              amount     DECIMAL(15, 2),
              `date`     STRING
          ) WITH (
                'connector' = 'datagen',
                'number-of-rows' = '1000'
          );

          CREATE TABLE transactions_summary
          (
              client_id STRING,
              amount    DECIMAL(15, 2),
              `date`    STRING
          ) WITH (
                'connector' = 'blackhole'
          );

          CREATE TABLE all_types_generated
          (
              `string`       STRING,
              `boolean`      BOOLEAN,
              `tinyInt`      TINYINT,
              `smallInt`     SMALLINT,
              `int`          INT,
              `bigint`       BIGINT,
              `float`        FLOAT,
              `double`       DOUBLE,
              `decimal`      DECIMAL,
              `date`         DATE,
              `time`         TIME,
              `timestamp`    TIMESTAMP,
              `timestampLtz` TIMESTAMP_LTZ,
              `row`          ROW<colStr STRING,colInt INT>,
              `array`        ARRAY<STRING>,
              `map`          MAP<STRING,STRING>,
              `multiset`     MULTISET<STRING>
          ) WITH (
                'connector' = 'datagen',
                'number-of-rows' = '1000'
          );
         """
        }
        flinkBatchOps {
          disabled: false
        }
      }
    }
    category: "BatchDev"
  }
  "periodic-dev": {
    deploymentConfig: {
      type: "flinkStreaming"
      scheduling {
        enabled: true
        processingType: streaming
        jarsDir: ${storageDir}/jars
      }
      restUrl: "http://jobmanager:8081"
      restUrl: ${?FLINK_REST_URL}
      useMiniClusterForDeployment: false
      scenarioStateVerification {
        enabled: ${?FLINK_SHOULD_VERIFY_BEFORE_DEPLOY}
      }
    }
    modelConfig: {
      classPath: ["model/devModel.jar", "model/flinkExecutor.jar", "components/flink", "components/common", "flink-dropwizard-metrics-deps/", "flink-metrics-plugins/"]
      rocksDB: {
        enable: ${?FLINK_ROCKSDB_ENABLE}
      }
      // We turn off checkpoing because it causes that bounded sources wait until first checkpoing even if
      // they finished emitting events. See https://issues.apache.org/jira/browse/FLINK-28386 for details
      checkpointConfig: null
      components.kafka {
        config: {
          kafkaProperties {
            "bootstrap.servers": ${KAFKA_ADDRESS}
            "schema.registry.url": ${SCHEMA_REGISTRY_URL}
          }
        }
      }
    }
    category: "Periodic"
  }
  "development-tests": {
    deploymentConfig: {
      type: "development-tests"
    }
    modelConfig: {
      classPath: ["model/devModel.jar", "model/flinkExecutor.jar", "components/flink", "flink-dropwizard-metrics-deps/"]
      components.kafka {
        config: {
          kafkaProperties {
            "bootstrap.servers": ${KAFKA_ADDRESS}
            "schema.registry.url": ${SCHEMA_REGISTRY_URL}
          }
        }
      }
      componentsUiConfig: {
        providedComponent-component-v1 {
          label: "component V1"
        }
      }
    }
    category: "DevelopmentTests"
  }
  "request-response-embedded": {
    deploymentConfig {
      type: "lite-embedded"
      mode: "request-response"
      http {
        port: 8181
        port: ${?REQUEST_RESPONSE_PORT}
        interface: ${?REQUEST_RESPONSE_INTERFACE}
      }
    }
    modelConfig {
      #TODO: handle streaming and rr lite in dirs...
      classPath: ["model/defaultModel.jar", "components/lite/liteRequestResponse.jar", "components/lite/liteBase.jar", "components/common"]

      components {
        databaseEnricher {
          config: {
            databaseQueryEnricher {
              name: "db-query"
              dbPool: ${sqlEnricherDbPool}
            }
            databaseLookupEnricher {
              name: "db-lookup"
              dbPool: ${sqlEnricherDbPool}
            }
          }
        }
        openAPI {
          url: ${OPENAPI_SERVICE_URL}"/swagger"
          rootUrl: ${OPENAPI_SERVICE_URL}
        }
      }
    }
    category: "RequestResponse"
  }
  "streaming-lite-k8s": {
    deploymentConfig {
      type: "lite-k8s"
      mode: "streaming"
      //FIXME: simplify, make it more human-friendly...
      configExecutionOverrides {
        metrics: ${metricsConfig}
      }
    }
    modelConfig {
      #TODO: handle streaming and rr lite in dirs...
      classPath: ["model/defaultModel.jar", "components/lite/liteBase.jar", "components/lite/liteKafka.jar", "components/common"]

      kafka {
        kafkaProperties {
          "bootstrap.servers": ${KAFKA_ADDRESS}
          "schema.registry.url": ${SCHEMA_REGISTRY_URL}
        }
      }
      exceptionHandlingConfig: {
        topic: "errors"
      }
    }
    category: "StreamingLiteK8s"
  }
  "request-response-k8s": {
    deploymentConfig {
      type: "lite-k8s"
      mode: "request-response"
      //FIXME: simplify, make it more human-friendly...
      configExecutionOverrides {
        metrics: ${metricsConfig}
      }
    }
    modelConfig {
      classPath: ["model/defaultModel.jar", "components/lite/liteBase.jar", "components/lite/liteRequestResponse.jar", "components/common"]
    }
    category: "RequestResponseK8s"
  }
  "streaming-lite-embedded": {
    deploymentConfig {
      type: "lite-embedded"
      mode: "streaming"
      metrics {
        instanceId: "local",
        environment: ${environment},
        influx {
          url: ${?INFLUXDB_URL}"/write",
          database: "nussknacker_metrics",
          database: ${?INFLUXDB_DATABASE},
          username: ${?INFLUXDB_USER},
          password: ${?INFLUXDB_PASSWORD},
        }
      }
    }
    modelConfig {
      classPath: ["model/defaultModel.jar", "components/lite/liteBase.jar", "components/lite/liteKafka.jar", "components/common"]

      kafka {
        kafkaProperties {
          "bootstrap.servers": ${KAFKA_ADDRESS}
          "schema.registry.url": ${SCHEMA_REGISTRY_URL}
        }
      }
      exceptionHandlingConfig: {
        topic: "errors"
      }
    }
    category: "StreamingLite"
  }
}

grafanaUrl: "/grafana"
grafanaUrl: ${?GRAFANA_URL}

metricsSettings {
  url: ${grafanaUrl}"/d/$dashboard?theme=dark&var-scenarioName=$scenarioName&var-env="${environment}
  defaultDashboard: "nussknacker-scenario"
  scenarioTypeToDashboard: {
    "streaming-lite-embedded": "nussknacker-lite-scenario",
    "streaming-lite-k8s": "nussknacker-lite-scenario",
    "request-response-k8s": "nussknacker-request-response-scenario",
  }
}

environmentAlert: {
  content: "DEVELOPMENT ENVIRONMENT"
  color: "indicator-green"
}

tabs = ${tabs} [
  {title: "Metrics", type: "Local", url: "/metrics", id: "metrics"},
]

componentLinks: [
  {id: "mainNu", title: "MainNu", icon: "/assets/components/CustomNode.svg", url: "https://nussknacker.io/", supportedComponentTypes: ["builtin"]},
  {id: "metrics", title: "Metrics", icon: "/assets/components/Filter.svg", url: "/metrics", supportedComponentTypes: ["builtin"]}
]

secondaryEnvironmentUri: "http://localhost:8080/api"
secondaryEnvironmentUri: ${?SECONADRY_ENVIRONMENT_URI}
secondaryEnvironment {
  uri: ${secondaryEnvironmentUri}
  user: "admin"
  password: "admin"
  targetEnvironmentId: "development"
  remoteConfig: {
  }
}

scenarioRepositoryLocation: ${storageDir}"/scenarioRepository"

commentSettings: {
  substitutionPattern: "(issues/[0-9]*)"
  substitutionLink: "https://github.com/TouK/nussknacker/$1"
}

countsSettings {
  influxUrl: "http://influxdb:8086/query"
  influxUrl: ${?INFLUXDB_URL}"/query"
  database: "nussknacker_metrics"
  database: ${?INFLUXDB_DATABASE}
  user: ${?INFLUXDB_USER},
  password: ${?INFLUXDB_PASSWORD},
}

developmentMode: true
developmentMode: ${?DEVELOPMENT_MODE}

testDataSettings: {
  testDataFormat: "CommonFormat"
}
