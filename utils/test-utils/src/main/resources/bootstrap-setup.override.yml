services:

  bootstrap-setup:
    image: touk/nussknacker-example-scenarios-library:1.11.0
    depends_on:
      designer:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      DISABLE_EMBEDDED_EXAMPLES: true
      NU_DESIGNER_URL: "http://designer:8080"
      NU_DESIGNER_USER: admin
      NU_DESIGNER_PASSWORD: admin
      NU_REQUEST_RESPONSE_OPEN_API_SERVICE_ADDRESS: "designer:8181"
      KAFKA_ADDRESS: "kafka:9092"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      SCHEMA_REGISTRY_USER: admin
      SCHEMA_REGISTRY_PASSWORD: admin
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  designer:
    expose:
      - 8181
