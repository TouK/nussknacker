openapi: "3.1.0"
info:
  title: OAuth2 secured API
  version: 1.0.0
servers:
  - url: http://dummy.io
paths:
  /oauth2Path:
    get:
      security:
        - oauth2Config: []
      responses:
        '200':
          description: "-"
          content:
            application/json:
              schema:
                type: object
      operationId: oauth2OperationId
components:
  schemas: {}
  securitySchemes:
    oauth2Config:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: http://dummy.io/oauth/token
          scopes: {}
