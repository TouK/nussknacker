services:

  designer:
    environment:
      EXAMPLE_SCENARIOS_LIBRARY_SERVICE_NAME: bootstrap-setup
      CONFIG_FILE: "/opt/nussknacker/conf/application.conf,/opt/nussknacker/conf/application-customizations.conf,/opt/nussknacker/conf/batch-customizations.conf,/opt/nussknacker/conf/offer-customer-proposal-customizations.conf,/opt/nussknacker/conf/rtm-client-near-pos-customizations.conf"
      # Batch adds 2 new processing types, each of them add MiniCluster for scenario testing purpose. Also batch components itself use MiniCluster.
      # It increases memory footprint significantly
      JDK_JAVA_OPTIONS: "-Xmx400M -XX:MaxMetaspaceSize=500M -XX:MaxDirectMemorySize=200M"
    volumes:
      - ../../e2e-tests/src/test/resources/batch-data-generation/batch-customizations.conf:/opt/nussknacker/conf/batch-customizations.conf
      - ../../e2e-tests/src/test/resources/batch-data-generation/transactions:/transactions
      - ../../e2e-tests/src/test/resources/offer-customer-proposal-based-on-activity-event/setup/nu-designer/custom-configuration.conf:/opt/nussknacker/conf/offer-customer-proposal-customizations.conf
      - ../../e2e-tests/src/test/resources/rtm-client-near-pos/setup/nu-designer/custom-configuration.conf:/opt/nussknacker/conf/rtm-client-near-pos-customizations.conf
    deploy:
      resources:
        limits:
          memory: 1300M
