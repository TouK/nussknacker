scenarioTypes {
  "batch": {
    deploymentConfig: {
      type: "flinkStreaming"
      restUrl: ${?FLINK_REST_URL}
    }
    modelConfig: {
      classPath: ["model/defaultModel.jar", "components/flink/flinkBase.jar", "components/flink-table/flinkTable.jar", "model/flinkExecutor.jar", "flink-dropwizard-metrics-deps/"]
      rocksDB: {
        enable: true
      }
      executionMode: "batch"
      components {
        table1 {
          providerType: "flinkTableDataSource"
          componentPrefix: "live-test-mode-"
          tableDefinition: """
             CREATE TABLE transactions (
                 `datetime` TIMESTAMP,
                 client_id  STRING,
                 amount     DECIMAL(15, 2),
                 amountDoubled AS amount * 2,
                 `file.name` STRING NOT NULL METADATA
             ) WITH (
                   'connector' = 'filesystem',
                   'path' = 'file:///transactions',
                   'format' = 'json'
             );
          """
        }
      }
    }
    category: "Default"
  }
}
