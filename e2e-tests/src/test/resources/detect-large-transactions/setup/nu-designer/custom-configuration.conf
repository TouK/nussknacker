scenarioTypes {
  "streaming" {
    modelConfig {
      liveDataPreview {
        enabled: true
        maxNumberOfSamples: 20
        throughputTimeWindowInSeconds: 60
        dbUploader {
          uploadIntervalInSeconds: 1
          dbUrl: "jdbc:hsqldb:file:"${storageDir}"/db;sql.syntax_ora=true"
          dbUrl: ${?DB_URL}
          dbUser: "SA"
          dbUser: ${?DB_USER}
          dbPassword: ""
          dbPassword: ${?DB_PASSWORD}
          dbSchema: "public"
        }
      }
    }
  }
}
