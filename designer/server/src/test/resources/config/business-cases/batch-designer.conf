include "../common-designer.conf"

authentication: {
  method: "BasicAuth"
  usersFile: "designer/server/src/test/resources/config/business-cases/basicauth-users.conf"
}

scenarioTypes {
  batch {
    deploymentConfig {
      restUrl: "http://will-be-changed-by-test-code:8081"
      type: "flinkStreaming"
    }
    modelConfig: {
      classPath: [
        "defaultModel/target/scala-"${scala.major.version}"/defaultModel.jar",
        "engine/flink/components/table/target/scala-"${scala.major.version}"/flinkTable.jar",
        "engine/flink/executor/target/scala-"${scala.major.version}"/flinkExecutor.jar",
        "engine/flink/executor/target/it-libs/flink-dropwizard-metrics-deps/"
      ]
      executionMode: "batch"
      components {
        flinkTableIO {
          testDataGenerationMode: "random"
          tableDefinition: """
            CREATE TABLE transactions
            (
                `datetime` TIMESTAMP,
                client_id  STRING,
                amount     DECIMAL(15,2),
                `date`     STRING
            ) PARTITIONED BY (`date`) WITH (
                  'connector' = 'filesystem',
                  'path' = 'file:///transactions',
                  'format' = 'csv'
            );

            CREATE TABLE transactions_summary
            (
                client_id STRING,
                amount    DECIMAL(15,2),
                `date`    STRING
            ) PARTITIONED BY (`date`) WITH (
                  'connector' = 'filesystem',
                  'path' = 'file:///output/transactions_summary',
                  'format' = 'csv'
            );
          """
        }
        flinkBatchOps {
          disabled: false
        }
      }
    }
    category: "Category1"
  }
}
