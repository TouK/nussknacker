include "../common-designer.conf"

authentication:  {
  method: "BasicAuth"
  usersFile: "designer/server/src/test/resources/config/business-cases/basicauth-users.conf"
}

baseModelConfig {
  classPath: [
    "defaultModel/target/scala-"${scala.major.version}"/defaultModel.jar",
    "engine/flink/components/base/target/scala-"${scala.major.version}"/flinkBase.jar",
    "engine/flink/components/base-unbounded/target/scala-"${scala.major.version}"/flinkBaseUnbounded.jar",
    "engine/flink/executor/target/scala-"${scala.major.version}"/flinkExecutor.jar"
  ]
}

scenarioTypes {
  streaming {
    deploymentConfig {
      type: "mockable"
    }
    modelConfig: ${baseModelConfig}
    category: "Category1"
  }
}
